name: Deploy KSV Orders Sheet Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep production deployments serialized. If several commits arrive quickly,
# the newest deployment supersedes an older queued/in-progress deployment.
concurrency:
  group: shopify-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Shopify app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Verify Shopify CLI
        run: shopify version

      - name: Deploy to Shopify production
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --config production --allow-updates --source-control-url "$COMMIT_URL"
